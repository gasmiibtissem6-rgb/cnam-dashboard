
name: CNAM Dashboard - CI

on:
  push:
    branches:
      - main
      - feature/devsecops-database
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, TypeScript, Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit and integration tests
        run: npm test -- --run

      - name: Production build
        run: npm run build
