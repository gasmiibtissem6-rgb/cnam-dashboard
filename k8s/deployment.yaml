apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnam-dashboard
  labels:
    app: cnam-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cnam-dashboard
  template:
    metadata:
      labels:
        app: cnam-dashboard
    spec:
      containers:
        - name: cnam-dashboard
          image: cnam-dashboard:main
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
